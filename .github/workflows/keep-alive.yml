name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://psmqzyzmargliajqzbcv.supabase.co/rest/v1/entries?select=id&limit=1" \
            -H "apikey: ${{ secrets.SB_ANON }}" \
            -H "Authorization: Bearer ${{ secrets.SB_ANON }}")
          echo "Supabase responded: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "::warning::Supabase returned $STATUS"
            exit 1
          fi
